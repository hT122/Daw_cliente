<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solución práctica - Tema 9</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container my-4">
    <h2 class="mb-3">Solución práctica – Tema 9</h2>

    <!-- Saludo al recargar (cookie) -->
    <h5 id="saludo" class="mb-3"></h5>

    <div class="card shadow-sm">
      <div class="card-header">
        Formulario con eventos, expresiones regulares y cookies
      </div>

      <div class="card-body">
        <!-- Mensaje general (Bootstrap alert) -->
        <div id="msg-registro" class="alert d-none" role="alert"></div>

        <form id="formulario" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de usuario</label>
            <input type="text" id="nombre" class="form-control">
            <div id="ayuda-nombre" class="form-text mensaje"></div>
            <div id="estado-nombre" class="mensaje"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="text" id="email" class="form-control">
            <div id="ayuda-email" class="form-text mensaje"></div>
            <div id="estado-email" class="mensaje"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control">
            <div id="ayuda-password" class="form-text mensaje"></div>
            <div id="estado-password" class="mensaje"></div>
          </div>

          <div class="mb-3">
            <label for="edad" class="form-label">Edad</label>
            <input type="text" id="edad" class="form-control">
            <div id="ayuda-edad" class="form-text mensaje"></div>
            <div id="estado-edad" class="mensaje"></div>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="recordarme" checked>
            <label class="form-check-label" for="recordarme">
              Recordarme (guardar cookie con el nombre)
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Enviar</button>
          <button type="button" id="btnEliminarCookie" class="btn btn-outline-danger ms-2">
            Eliminar cookie
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js.js"></script>
</body>
</html>
