<div class="card shadow-sm mt-3">
  <div class="card-header bg-dark text-white">
    <h3 class="mb-0">🔐 Generador de Contraseñas</h3>
  </div>

  <div class="card-body">

    <div class="input-group input-group-lg mb-4">
      <input type="text" class="form-control text-center font-monospace fw-bold"
             [value]="passwordGenerada" readonly placeholder="Tu contraseña aparecerá aquí">
      <button class="btn btn-outline-secondary" type="button" (click)="copiarAlPortapapeles()"
              [disabled]="!passwordGenerada">
        📋 Copiar
      </button>
    </div>

    @if (mensajeCopia) {
      <div class="alert alert-success text-center py-1 mb-3">
        {{ mensajeCopia }}
      </div>
    }

    <div class="row g-3">
      <div class="col-12 mb-3">
        <label class="form-label fw-bold">Longitud: {{ longitud }} caracteres</label>
        <input type="range" class="form-range" min="4" max="30" [(ngModel)]="longitud" (input)="generarPassword()">
      </div>

      <div class="col-md-6">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="mayus" [(ngModel)]="incluirMayusculas">
          <label class="form-check-label" for="mayus">Mayúsculas (A-Z)</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="minus" [(ngModel)]="incluirMinusculas">
          <label class="form-check-label" for="minus">Minúsculas (a-z)</label>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="nums" [(ngModel)]="incluirNumeros">
          <label class="form-check-label" for="nums">Números (0-9)</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="syms" [(ngModel)]="incluirSimbolos">
          <label class="form-check-label" for="syms">Símbolos (@#$)</label>
        </div>
      </div>
    </div>

    <div class="d-grid gap-2 mt-4">
      <button class="btn btn-primary btn-lg" (click)="generarPassword()">
        🔄 Generar Nueva Contraseña
      </button>
    </div>

  </div>
