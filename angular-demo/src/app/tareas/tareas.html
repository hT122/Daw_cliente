<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <h3 class="mb-0">Mis Tareas ({{ listaTareas.length }})</h3>
  </div>

  <div class="card-body">
    <div class="input-group mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="Nueva tarea..."
        [(ngModel)]="nuevaTarea"
        (keyup.enter)="agregarTarea()">
      <button class="btn btn-success" (click)="agregarTarea()">Añadir</button>
    </div>

    @if (listaTareas.length === 0) {
      <div class="alert alert-info text-center">
        No hay tareas pendientes. ¡Añade una!
      </div>
    }

    <ul class="list-group">
      @for (tarea of listaTareas; track $index) {
        <li class="list-group-item d-flex justify-content-between align-items-center"
            [class.list-group-item-success]="tarea.completada">

          <div>
            <input
              class="form-check-input me-2"
              type="checkbox"
              [(ngModel)]="tarea.completada"
              (change)="toggleCompletada()">

            <span [class.text-decoration-line-through]="tarea.completada">
              {{ tarea.texto }}
            </span>
          </div>

          <button class="btn btn-danger btn-sm" (click)="eliminarTarea($index)">
            🗑️ Eliminar
          </button>
        </li>
      }
    </ul>
  </div>
</div>
